name: Build Play! PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Play! emulator source (for headers)
        run: |
          git clone --depth 1 https://github.com/play-emu/play.git /opt/play-emu

      - name: Install PS3 toolchain (pre-compiled from ps3dev releases)
        run: |
          # Instala dependências
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip wget xz-utils libgmp-dev libmpfr-dev libmpc-dev texinfo

          # Baixa toolchain pré-compilado (ps3dev releases)
          # Versão mais recente conhecida funcional
          cd /tmp
          wget -q https://github.com/ps3dev/ps3toolchain/releases/download/2023-07-22/ps3toolchain-2023-07-22-ubuntu-22.04.tar.xz
          sudo tar -xf ps3toolchain-2023-07-22-ubuntu-22.04.tar.xz -C /
          export PATH="/usr/local/ps3dev/bin:$PATH"

          # Verifica
          which ppu-g++
          ppu-g++ --version

      - name: Verify tools
        run: |
          export PATH="/usr/local/ps3dev/bin:$PATH"
          which make_self_npdrm
          which sfo.py
          which pkg.py

      - name: Build project
        run: |
          export PATH="/usr/local/ps3dev/bin:$PATH"
          export EXTRA_INCLUDES="-I/opt/play-emu/src -I/opt/play-emu/src/ui_ps3"
          make clean
          make pkg
        env:
          PSL1GHT: /usr/local/ps3dev

      - name: Verify PKG output
        run: |
          ls -la play_ps3.pkg
          file play_ps3.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: play_ps3_pkg
          path: play_ps3.pkg
          retention-days: 30