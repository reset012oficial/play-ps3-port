name: Build Play! PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: hldtux/ps3dev:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Play! emulator source (for headers)
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          path: play-emu
          fetch-depth: 1

      - name: Link Play! source to /opt/play-emu
        run: |
          ln -sf ${{ github.workspace }}/play-emu /opt/play-emu

      - name: Find Python packaging tools (sfo.py, pkg.py)
        run: |
          # Procura sfo.py e pkg.py no container
          find / -name "sfo.py" -type f 2>/dev/null || true
          find / -name "pkg.py" -type f 2>/dev/null || true

          # Se não achou, instala via pip (são do ps3tools)
          if ! command -v sfo.py &> /dev/null; then
            pip3 install ps3tools 2>/dev/null || pip3 install --break-system-packages ps3tools 2>/dev/null || true
          fi

          # Verifica novamente
          which sfo.py || find / -name "sfo.py" -type f 2>/dev/null
          which pkg.py || find / -name "pkg.py" -type f 2>/dev/null

      - name: Verify PSL1GHT installation
        run: |
          echo "PSL1GHT path: /usr/local/ps3dev"
          ls -la /usr/local/ps3dev
          which ppu-g++
          which make_self_npdrm
          which sfo.py
          which pkg.py

      - name: Build project
        run: |
          export EXTRA_INCLUDES="-I/opt/play-emu/src -I/opt/play-emu/src/ui_ps3"
          export PATH="/usr/local/ps3dev/bin:$PATH"
          make clean
          make pkg
        env:
          PSL1GHT: /usr/local/ps3dev

      - name: Verify PKG output
        run: |
          ls -la play_ps3.pkg
          file play_ps3.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: play_ps3_pkg
          path: play_ps3.pkg
          retention-days: 30