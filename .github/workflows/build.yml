name: Build Play! PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: hldtux/ps3dev:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Play! emulator source (for headers)
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          path: play-emu
          fetch-depth: 1

      - name: Link Play! source to /opt/play-emu
        run: |
          ln -sf ${{ github.workspace }}/play-emu /opt/play-emu

      - name: Explore Play! repo structure
        run: |
          echo "=== /opt/play-emu contents ==="
          ls -la /opt/play-emu
          echo ""
          echo "=== First level dirs ==="
          find /opt/play-emu -maxdepth 2 -type d 2>/dev/null | head -30
          echo ""
          echo "=== All .h files ==="
          find /opt/play-emu -name "*.h" -type f 2>/dev/null | head -50

      - name: Find or install Python packaging tools
        run: |
          # Procura no container
          find / -name "sfo.py" -type f 2>/dev/null | head -5
          find / -name "pkg.py" -type f 2>/dev/null | head -5

          # Se não achou, baixa do PSL1GHT source e procura
          if ! command -v sfo.py &> /dev/null; then
            echo "Baixando PSL1GHT source..."
            cd /tmp
            git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git
            find PSL1GHT -name "sfo.py" -type f 2>/dev/null
            find PSL1GHT -name "pkg.py" -type f 2>/dev/null

            # Copia se achar
            find PSL1GHT -name "sfo.py" -exec cp {} /usr/local/ps3dev/bin/ \;
            find PSL1GHT -name "pkg.py" -exec cp {} /usr/local/ps3dev/bin/ \;
            chmod +x /usr/local/ps3dev/bin/sfo.py /usr/local/ps3dev/bin/pkg.py 2>/dev/null || true
          fi

          # Verifica
          which sfo.py
          which pkg.py

      - name: Verify PSL1GHT installation
        run: |
          echo "PSL1GHT path: /usr/local/ps3dev"
          ls -la /usr/local/ps3dev
          which ppu-g++
          which make_self_npdrm
          which sfo.py
          which pkg.py

      - name: Build project
        run: |
          export EXTRA_INCLUDES="-I/opt/play-emu/src -I/opt/play-emu/src/ui_ps3 -I/usr/local/ps3dev/ppu/include"
          export PATH="/usr/local/ps3dev/bin:$PATH"
          make clean
          make pkg
        env:
          PSL1GHT: /usr/local/ps3dev

      - name: Verify PKG output
        run: |
          ls -la play_ps3.pkg
          file play_ps3.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: play_ps3_pkg
          path: play_ps3.pkg
          retention-days: 30