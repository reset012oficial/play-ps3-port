name: Build Play! PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: hldtux/ps3dev:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Play! emulator source (for headers)
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          path: play-emu
          fetch-depth: 1
        continue-on-error: true

      - name: Verify Play! checkout / fallback clone
        run: |
          set -x
          if [ ! -d "${{ github.workspace }}/play-emu/.git" ] || [ -z "$(ls -A ${{ github.workspace }}/play-emu 2>/dev/null)" ]; then
            echo "Checkout falhou ou diretório vazio — tentando clones alternativos..."
            rm -rf ${{ github.workspace }}/play-emu

            # Tenta URLs conhecidas do Play!
            for url in \
              "https://github.com/jpd002/Play-.git" \
              "https://github.com/jpd002/Play.git" \
              "https://github.com/play-/play.git" \
              "https://github.com/play-emu/play.git"; do
              echo "Tentando: $url"
              if git clone --depth 1 "$url" ${{ github.workspace }}/play-emu 2>&1; then
                echo "Sucesso com: $url"
                break
              fi
              rm -rf ${{ github.workspace }}/play-emu
            done
          else
            echo "Checkout OK: $(ls ${{ github.workspace }}/play-emu | wc -l) itens"
          fi
          echo "=== Conteúdo final ==="
          ls -la ${{ github.workspace }}/play-emu

      - name: Link Play! source to /opt/play-emu
        run: |
          ln -sf ${{ github.workspace }}/play-emu /opt/play-emu

      - name: Explore Play! repo structure
        run: |
          echo "=== Symlink target ==="
          readlink -f /opt/play-emu
          echo ""
          echo "=== Target contents ==="
          ls -la "$(readlink -f /opt/play-emu)"
          echo ""
          echo "=== All dirs (depth 3) ==="
          find "$(readlink -f /opt/play-emu)" -maxdepth 3 -type d 2>/dev/null | sort
          echo ""
          echo "=== All .h files ==="
          find "$(readlink -f /opt/play-emu)" -name "*.h" -type f 2>/dev/null | sort
          echo ""
          echo "=== Looking for AppConfig.h ==="
          find "$(readlink -f /opt/play-emu)" -name "AppConfig.h" -type f 2>/dev/null
          echo ""
          echo "=== Looking for PS2VM.h ==="
          find "$(readlink -f /opt/play-emu)" -name "PS2VM.h" -type f 2>/dev/null
          echo ""
          echo "=== Looking for PS2VM_Preferences.h ==="
          find "$(readlink -f /opt/play-emu)" -name "PS2VM_Preferences.h" -type f 2>/dev/null

      - name: Find or install Python packaging tools
        run: |
          # Procura no container
          find / -name "sfo.py" -type f 2>/dev/null | head -5
          find / -name "pkg.py" -type f 2>/dev/null | head -5

          # Se não achou, baixa do PSL1GHT source e procura
          if ! command -v sfo.py &> /dev/null; then
            echo "Baixando PSL1GHT source..."
            cd /tmp
            git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git
            find PSL1GHT -name "sfo.py" -type f 2>/dev/null
            find PSL1GHT -name "pkg.py" -type f 2>/dev/null

            # Copia se achar
            find PSL1GHT -name "sfo.py" -exec cp {} /usr/local/ps3dev/bin/ \;
            find PSL1GHT -name "pkg.py" -exec cp {} /usr/local/ps3dev/bin/ \;
            chmod +x /usr/local/ps3dev/bin/sfo.py /usr/local/ps3dev/bin/pkg.py 2>/dev/null || true
          fi

          # Verifica
          which sfo.py
          which pkg.py

      - name: Verify PSL1GHT installation
        run: |
          echo "PSL1GHT path: /usr/local/ps3dev"
          ls -la /usr/local/ps3dev
          which ppu-g++
          which make_self_npdrm
          which sfo.py
          which pkg.py

      - name: Build project
        run: |
          PLAY_EMU_ROOT="/opt/play-emu"

          if [ ! -f "$PLAY_EMU_ROOT/Source/app_shared/AppConfig.h" ] || [ ! -f "$PLAY_EMU_ROOT/Source/PS2VM.h" ]; then
            echo "Missing Play! emulator headers in $PLAY_EMU_ROOT"
            find "$PLAY_EMU_ROOT" \( -path '*/AppConfig.h' -o -path '*/PS2VM.h' -o -path '*/PS2VM_Preferences.h' \) 2>/dev/null || true
            exit 1
          fi

          # Paths reais do Play! upstream
          export EXTRA_INCLUDES="-I$PLAY_EMU_ROOT/Source -I$PLAY_EMU_ROOT/Source/app_shared -I$PLAY_EMU_ROOT/Source/ee -I$PLAY_EMU_ROOT/Source/gs -I$PLAY_EMU_ROOT/Source/sound -I/usr/local/ps3dev/ppu/include"
          export PATH="/usr/local/ps3dev/bin:$PATH"
          make clean
          make pkg
        env:
          PSL1GHT: /usr/local/ps3dev

      - name: Verify PKG output
        run: |
          ls -la play_ps3.pkg
          file play_ps3.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: play_ps3_pkg
          path: play_ps3.pkg
          retention-days: 30