name: Build Play! PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: hldtux/ps3dev:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Play! emulator source (for headers)
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          path: play-emu
          fetch-depth: 1

      - name: Link Play! source to /opt/play-emu
        run: |
          # Use GITHUB_WORKSPACE env var (set correctly inside container) instead of github.workspace context
          ln -sf "$GITHUB_WORKSPACE/play-emu" /opt/play-emu
          echo "=== Play! emulator contents ==="
          ls -la /opt/play-emu
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"

      - name: Explore Play! emulator source structure
        run: |
          echo "=== Play! emulator root ==="
          ls -la /opt/play-emu
          echo ""
          echo "=== Play! Source directory structure ==="
          find /opt/play-emu/Source -type f -name "*.h" 2>/dev/null | head -100
          echo ""
          echo "=== Looking for specific headers ==="
          for h in AppConfig.h PS2VM.h PS2VM_Preferences.h GSH_Null.h PH_Generic.h ControllerInfo.h PS2OS.h Types.h; do
            echo "--- $h ---"
            find /opt/play-emu -name "$h" -type f 2>/dev/null
          done

      - name: Find or install Python packaging tools
        run: |
          # Procura no container
          find / -name "sfo.py" -type f 2>/dev/null | head -5
          find / -name "pkg.py" -type f 2>/dev/null | head -5

          # Se não achou, baixa do PSL1GHT source e compila/instala
          if ! command -v sfo.py &> /dev/null; then
            echo "Baixando PSL1GHT source..."
            cd /tmp
            git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git
            find PSL1GHT -name "sfo.py" -type f 2>/dev/null
            find PSL1GHT -name "pkg.py" -type f 2>/dev/null

            # Compila pkgcrypt (C extension)
            echo "Compilando pkgcrypt..."
            cd PSL1GHT/tools/ps3py
            python3 setup.py build_ext --inplace

            # Copia todos os módulos Python e a extensão compilada
            cp *.py /usr/local/ps3dev/bin/
            cp pkgcrypt*.so /usr/local/ps3dev/bin/ 2>/dev/null || true
            chmod +x /usr/local/ps3dev/bin/*.py 2>/dev/null || true

            cd /tmp
          fi

          # Verifica
          which sfo.py
          which pkg.py
          python3 -c "import Struct; import pkgcrypt; print('Python modules OK')" 2>&1

      - name: Verify PSL1GHT installation
        run: |
          echo "PSL1GHT path: /usr/local/ps3dev"
          ls -la /usr/local/ps3dev
          which ppu-g++
          which make_self_npdrm
          which sfo.py
          which pkg.py

      - name: Build project
        run: |
          PLAY_EMU_ROOT="/opt/play-emu"

          # Check for critical Play! headers (Config.h and SH_Null.h are local stubs)
          echo "=== Checking for Play! headers ==="
          for h in AppConfig.h PS2VM.h PS2VM_Preferences.h PH_Generic.h ControllerInfo.h; do
            found=$(find "$PLAY_EMU_ROOT" -name "$h" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "FOUND: $h at $found"
            else
              echo "MISSING: $h"
            fi
          done

          # IMPORTANT: Local stubs FIRST so they override Play! headers
          EXTRA_INC="-I$(pwd)/Source/ui_ps3"
          # Then add Play! Source subdirectories
          for d in $(find "$PLAY_EMU_ROOT/Source" -type d 2>/dev/null); do
            EXTRA_INC="$EXTRA_INC -I$d"
          done
          # Also add the Play! root
          EXTRA_INC="$EXTRA_INC -I$PLAY_EMU_ROOT"
          # Adiciona ppu include path
          EXTRA_INC="$EXTRA_INC -I/usr/local/ps3dev/ppu/include"
          export EXTRA_INCLUDES="$EXTRA_INC"

          echo "=== EXTRA_INCLUDES ==="
          echo "$EXTRA_INCLUDES"

          export PATH="/usr/local/ps3dev/bin:$PATH"
          make clean
          make pkg
        env:
          PSL1GHT: /usr/local/ps3dev

      - name: Verify PKG output
        run: |
          ls -la play_ps3.pkg
          file play_ps3.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: play_ps3_pkg
          path: play_ps3.pkg
          retention-days: 30