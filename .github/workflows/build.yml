name: Build Play! PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Play! emulator source (for headers)
        run: |
          git clone --depth 1 https://github.com/play-emu/play.git /opt/play-emu

      - name: Install PSL1GHT toolchain
        run: |
          # Instala dependências
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip wget xz-utils

          # Baixa e instala PSL1GHT (ps3dev)
          cd /tmp
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          sudo ./toolchain.sh

      - name: Verify PSL1GHT installation
        run: |
          echo "PSL1GHT path: $PSL1GHT"
          ls -la $PSL1GHT
          which ppu-g++
          which make_self_npdrm
          which sfo.py
          which pkg.py

      - name: Build project
        run: |
          export EXTRA_INCLUDES="-I/opt/play-emu/src -I/opt/play-emu/src/ui_ps3"
          make clean
          make pkg
        env:
          PSL1GHT: /usr/local/ps3dev

      - name: Verify PKG output
        run: |
          ls -la play_ps3.pkg
          file play_ps3.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: play_ps3_pkg
          path: play_ps3.pkg
          retention-days: 30